name: Cppcheck

on:
  push:
    paths:
      - 'sakura_core/**/*.cpp'
      - 'src/main/cpp/**/*.cpp'
  pull_request:
    paths:
      - 'sakura_core/**/*.cpp'
      - 'src/main/cpp/**/*.cpp'
  workflow_dispatch:

defaults:
  run:
    shell: msys2 {0} # 指定しない限りmsys2シェルを使う

jobs:
  cppcheck:
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      matrix:
        BuildPlatform: [Win32, x64]
        Configuration: [Release]
    env:
      BuildPlatform: ${{ matrix.BuildPlatform }}
      Configuration: ${{ matrix.Configuration }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cppcheck

      - name: Run cppcheck
        run: ./run-cppcheck.bat ${{ env.BuildPlatform }} ${{ env.Configuration }}

      - name: Zip files for artifacts
        run: zipArtifacts.bat ${{ env.BuildPlatform }} ${{ env.Configuration }}
        shell: cmd

      - name: Upload cppcheck log artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cppcheck_${{ env.BuildPlatform }}_${{ env.Configuration }}
          path: '**Log.zip'
