name: macOS Build

on:
  push:
    branches: [macos]
  pull_request:
    branches: [macos]
    paths:
      - 'macos/**'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

jobs:
  # 与 build-sakura.yml 的 check-encoding 相同的规则：Mac 版新增的 .cpp / .h / .mm 必须是带 BOM 的 UTF-8
  check-encoding:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check encoding
        run: |
          ng=0
          while IFS= read -r -d '' f; do
            if [ "$(head -c 3 "$f" | od -An -tx1 | tr -d ' ')" != "efbbbf" ]; then
              echo "NG (not UTF-8 with BOM): $f"; ng=1
            fi
          done < <(git ls-files -z -- 'macos/*.h' 'macos/*.cpp' 'macos/*.mm')
          exit $ng

  build:
    needs: check-encoding
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: macos/app
        run: xcodegen generate

      - name: Build (Release, unsigned)
        working-directory: macos/app
        run: |
          set -o pipefail
          xcodebuild \
            -project SakuraMac.xcodeproj \
            -scheme SakuraMac \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Check app bundle
        working-directory: macos/app
        run: |
          APP="build/Build/Products/Release/Sakura Editor for Mac.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$APP/Contents/Info.plist"
          lipo -archs "$APP/Contents/MacOS/Sakura Editor for Mac"
          lipo -archs "$APP/Contents/MacOS/Sakura Editor for Mac" | grep -q arm64
          lipo -archs "$APP/Contents/MacOS/Sakura Editor for Mac" | grep -q x86_64
