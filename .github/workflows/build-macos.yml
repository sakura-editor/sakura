name: macOS Build

on:
  push:
    branches: [macos]
  pull_request:
    branches: [macos]
    paths:
      - 'macos/**'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

jobs:
  # 与 build-sakura.yml 的 check-encoding 相同的规则：Mac 版新增的 .cpp / .h / .mm 必须是带 BOM 的 UTF-8
  check-encoding:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check encoding
        run: |
          ng=0
          while IFS= read -r -d '' f; do
            if [ "$(head -c 3 "$f" | od -An -tx1 | tr -d ' ')" != "efbbbf" ]; then
              echo "NG (not UTF-8 with BOM): $f"; ng=1
            fi
          done < <(git ls-files -z -- 'macos/*.h' 'macos/*.cpp' 'macos/*.mm')
          exit $ng

  # 第 14 步：UTF-16 字符类型（sakura_core/util/wchar16.h）在两个平台上编译并运行测试
  wchar16-test-macos:
    needs: check-encoding
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and run test_wchar16 (clang, universal)
        run: |
          clang++ -std=c++20 -Wall -Wextra -DNOMINMAX -arch arm64 -arch x86_64 \
            -I macos/platform/include -I sakura_core \
            macos/platform/tests/test_wchar16.cpp -o test_wchar16
          lipo -archs test_wchar16
          ./test_wchar16

  # 第 16 步：Mac 版核心库（macos/core）的构建和单元测试
  core-tests-macos:
    needs: check-encoding
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: cmake -S macos/core -B build/mac-core -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        run: cmake --build build/mac-core -j 4

      - name: Test
        run: ctest --test-dir build/mac-core --output-on-failure -j 4

  wchar16-test-windows:
    needs: check-encoding
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and run test_wchar16 (MSVC x64)
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 /utf-8 /DNOMINMAX /DUNICODE /D_UNICODE /I sakura_core macos\platform\tests\test_wchar16.cpp /Fe:test_wchar16.exe || exit /b 1
          test_wchar16.exe

  # 第 17 步：在 Windows 上导出代码页转换表（Mac 版的 MultiByteToWideChar 等按这份表实现）。
  # 导出结果作为 artifact 上传；仓库里已提交 macos/platform/data/codepages.bin 时，检查两者一致。
  codepage-dump-windows:
    needs: check-encoding
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and run dump_codepages (MSVC x64)
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 /utf-8 /DUNICODE /D_UNICODE macos\tools\codepage_dump\dump_codepages.cpp /Fe:dump_codepages.exe || exit /b 1
          mkdir out
          dump_codepages.exe out\codepages.bin out\codepages.tsv || exit /b 1
          ver > out\windows-version.txt

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codepages
          path: out/

      - name: Compare with committed table
        run: |
          if not exist macos\platform\data\codepages.bin exit /b 0
          fc /b out\codepages.bin macos\platform\data\codepages.bin > nul || echo ::warning::codepages.bin differs from the table dumped on this Windows version

  build:
    needs: check-encoding
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: macos/app
        run: xcodegen generate

      - name: Build (Release, unsigned)
        working-directory: macos/app
        run: |
          set -o pipefail
          xcodebuild \
            -project SakuraMac.xcodeproj \
            -scheme SakuraMac \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Check app bundle
        working-directory: macos/app
        run: |
          APP="build/Build/Products/Release/Sakura Editor for Mac.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$APP/Contents/Info.plist"
          lipo -archs "$APP/Contents/MacOS/Sakura Editor for Mac"
          lipo -archs "$APP/Contents/MacOS/Sakura Editor for Mac" | grep -q arm64
          lipo -archs "$APP/Contents/MacOS/Sakura Editor for Mac" | grep -q x86_64
